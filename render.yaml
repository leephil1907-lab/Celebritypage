# render.com blueprint — the durable deployment path.
#
# Unlike a serverless host, this one keeps the SQLite database and the uploads: the disk is mounted
# at /app/data, and DATA_DIR/UPLOAD_DIR point into it, so members, waitlists and content survive a
# restart, a redeploy and a cold start.
#
#   Render → New → Blueprint → point it at this repository
#
# ADMIN_PASSWORD and SITE_URL are `sync: false`: Render will ask for them when the blueprint is
# created, and they are never stored in this file. `npm run check` verifies this file mounts a disk
# where DATA_DIR points, and that every environment variable the app reads is documented in
# .env.example.
services:
  - type: web
    name: starto-celebritypage
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # closest to the Asian audience; also frankfurt · oregon · ohio · virginia
    # plan omitted on purpose: a disk needs a paid instance type, and pinning a pricing name in the
    # repository is how a blueprint stops validating when a host renames its tiers. Pick one when
    # Render asks — Starter is the smallest that allows a disk.
    healthCheckPath: /healthz  # the app answers this only once SQLite is open
    autoDeployTrigger: commit  # redeploy on every push to the branch (Render renamed this key)
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000            # Render routes the public port here
      - key: COMBINED
        value: "1"              # one origin: the console lives at /admin
      - key: DATA_DIR
        value: /app/data
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: SITE_URL
        sync: false             # e.g. https://starto.example.com — set in the dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false             # authoritative on every boot; without it the app reports a generated one
