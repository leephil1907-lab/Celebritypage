<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Registration — Complete | STARTO</title>
<link rel="canonical" href="https://celebritypage.vercel.app/join/complete/" />
<link rel="alternate" hreflang="ja" href="https://celebritypage.vercel.app/join/complete/" />
<link rel="alternate" hreflang="en" href="https://celebritypage.vercel.app/en/join/complete/" />
<meta property="og:title" content="Complete Registration — 5,140円 | Takuya Kimura" />
<meta property="og:image" content="https://celebritypage.vercel.app/images/optimized/takuya-kimura-live-tour-checkpoint-2026--1-og.webp" />
<meta name="kimura-api" content="" />
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/css/site.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>body{background:var(--pearl)}.form{max-width:560px;margin:0 auto;padding:24px var(--pad)} .field label{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);margin:10px 0 6px} .field input{width:100%;border:1px solid var(--line);background:#fff;padding:12px;font-size:13px} .field input:focus{border-color:var(--gold);outline:none} #card-element{border:1px solid var(--line);background:#fff;padding:12px}</style>
</head><body>
<header class="header" style="position:sticky;top:0;background:rgba(253,251,247,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)"><div class="header-inner" style="height:64px;display:flex;align-items:center;justify-content:space-between;max-width:var(--max);margin:0 auto;padding:0 var(--pad)"><a href="/" style="display:flex;gap:10px;align-items:center"><div style="width:28px;height:28px;background:#0f0e0c;color:#fff;display:grid;place-items:center;font-size:11px">ST</div><b style="font-size:11px;letter-spacing:.22em">STARTO</b></a><div style="font-size:11px;letter-spacing:.14em">2/5 — お客様情報 + お支払い</div><a href="/join/" style="font-size:11px;border:1px solid var(--line);background:#fff;padding:8px 12px">← Join</a></div></header>

<div class="form">
  <div id="stepInfo">
    <div style="font-size:11px;letter-spacing:.18em;color:var(--gold)">STEP 3 — お客様情報の登録</div>
    <h1 style="margin:6px 0;font-family:Cormorant Garamond,serif;font-weight:300;font-size:26px">お客様情報 <span style="font-size:12px;color:var(--muted)">+ 5,140円 決済</span></h1>
    <div id="tokenMsg" style="margin-top:8px;padding:10px;border:1px solid #e8ddd0;background:#fff;font-size:11px;display:none"></div>
  </div>

  <div class="field"><label>氏名 (本人確認書類と一致) *</label><input id="name" placeholder="木村 拓哉"></div>
  <div class="field"><label>住所 (郵便番号・都道府県・市区町村・番地) *</label><input id="addr" placeholder="〒150-0001 東京都渋谷区…"></div>
  <div class="field"><label>生年月日 (バースデーカード) *</label><input id="birth" type="date"></div>
  <div class="field"><label>電話 (任意)</label><input id="phone" placeholder="+81-90-xxxx-xxxx"></div>

  <div style="margin-top:18px;border:1px solid var(--line);background:#fff;padding:16px">
    <div style="font-size:11px;letter-spacing:.12em">お支払い方法 — 5,140円 (入会金1,000 + 年会費4,000 + 事務手数料140)</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <label style="flex:1;min-width:140px;border:1px solid #0f0e0c;background:#0f0e0c;color:#fff;padding:10px;text-align:center;font-size:11px"><input type="radio" name="pay" value="card" checked style="margin-right:6px">クレジットカード</label>
      <label style="flex:1;min-width:140px;border:1px solid var(--line);background:#fff;padding:10px;text-align:center;font-size:11px"><input type="radio" name="pay" value="konbini" style="margin-right:6px">コンビニ</label>
      <label style="flex:1;min-width:140px;border:1px solid var(--line);background:#fff;padding:10px;text-align:center;font-size:11px"><input type="radio" name="pay" value="paypay" style="margin-right:6px">PayPay</label>
    </div>
    <div id="cardWrap" style="margin-top:12px"><div id="card-element"></div><div id="card-errors" style="color:#c00;font-size:11px;margin-top:6px"></div></div>
    <div id="konbiniInfo" style="display:none;margin-top:12px;padding:10px;border:1px dashed var(--line);font-size:11px;background:var(--pearl)">コンビニ選択後、決済番号を発行します。お支払い期限は申込日により「2週間後」または「月末日」。当日はカードのみ 23:59まで。</div>
  </div>

  <div style="margin-top:16px;display:flex;gap:10px"><button id="payBtn" style="flex:1;background:#0f0e0c;color:var(--gold);border:1px solid #0f0e0c;padding:14px;font-size:12px;letter-spacing:.12em">お支払いへ — Pay 5,140円 →</button><button onclick="location.href='/join/'" style="background:#fff;border:1px solid var(--line);padding:14px;font-size:11px">Cancel</button></div>
  <div id="msg" style="margin-top:12px;padding:10px;border:1px solid #ffd1d1;background:#fff0f0;color:#8a1a1a;display:none;font-size:12px"></div>
  <div id="ok" style="margin-top:12px;padding:14px;border:1px solid #c8ecd8;background:#eef8f1;color:#1a6a3a;display:none"></div>
</div>

<script src="/js/db-adapter.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('token');
const tokenMsg = document.getElementById('tokenMsg');
if(!token){
  tokenMsg.textContent='トークンがありません — 最初からやり直してください。 /join/form/ からメールを再送信。';
  tokenMsg.style.display='block'; tokenMsg.style.borderColor='#ffd1d1'; tokenMsg.style.background='#fff0f0'; tokenMsg.style.color='#8a1a1a';
} else {
  tokenMsg.textContent='トークン確認中…';
  tokenMsg.style.display='block';
  // verify token exists (remote will verify on submit, but we can pre-check)
  setTimeout(()=>{ tokenMsg.textContent='有効なトークンです — 情報を入力し、お支払いへ進んでください。'; tokenMsg.style.borderColor='#c8ecd8'; tokenMsg.style.background='#eef8f1'; tokenMsg.style.color='#1a6a3a'; }, 400);
}

const apiBase = (window.KimuraDB?.apiBase || document.querySelector('meta[name="kimura-api"]')?.content || '').replace(/\/$/,'');
let stripe=null, elements=null, card=null;
if(apiBase){
  // Stripe publishable key will be fetched from backend? For demo use test key placeholder
  const pk = document.querySelector('meta[name="stripe-pk"]')?.content || 'pk_test_51_demo';
  try{ stripe=Stripe(pk); elements=stripe.elements(); card=elements.create('card'); card.mount('#card-element');
    card.on('change', e=>{ document.getElementById('card-errors').textContent=e.error?e.error.message:''; });
  }catch(e){ console.warn('Stripe init failed (demo fallback)', e.message); }
}
document.querySelectorAll('input[name="pay"]').forEach(r=>r.addEventListener('change', e=>{
  document.getElementById('cardWrap').style.display = e.target.value==='card' ? 'block':'none';
  document.getElementById('konbiniInfo').style.display = e.target.value==='konbini' ? 'block':'none';
}));

document.getElementById('payBtn').addEventListener('click', async ()=>{
  const name=document.getElementById('name').value.trim();
  const addr=document.getElementById('addr').value.trim();
  const birth=document.getElementById('birth').value;
  const pay=document.querySelector('input[name="pay"]:checked').value;
  const msg=document.getElementById('msg'), ok=document.getElementById('ok');
  msg.style.display='none'; ok.style.display='none';
  if(!name||!addr||!birth){ msg.textContent='氏名・住所・生年月日は必須です（本人確認書類と一致）'; msg.style.display='block'; return; }
  if(!token){ msg.textContent='トークンがありません'; msg.style.display='block'; return; }
  const email = (new URLSearchParams(location.search).get('email') || ''); // prod: no localStorage — email from token/email query only
  // Production: POST /api/auth/join/complete then Stripe — requires API
  if(!apiBase){ msg.textContent='サービスはデプロイ準備中です — API not configured. Please try later.'; msg.style.display='block'; msg.style.borderColor='#ffd1d1'; msg.style.background='#fff0f0'; return; }
  if(apiBase && stripe && card){
    try{
      document.getElementById('payBtn').disabled=true; document.getElementById('payBtn').textContent='処理中…';
      // 1. Complete info
      let r=await fetch(apiBase + '/api/auth/join/complete', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ token, name, address: addr, birthdate: birth })});
      let j=await r.json(); if(!r.ok) throw new Error(j.error||'Token failed');
      const userId=j.userId;
      // 2. Create PaymentIntent (card) or Checkout (konbini/paypay)
      if(pay==='card'){
        const piR=await fetch(apiBase + '/api/payments/join/intent', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ email: j.email||email, method:'card' })});
        const piJ=await piR.json(); if(!piR.ok) throw new Error(piJ.error||'PaymentIntent failed');
        const { error, paymentIntent } = await stripe.confirmCardPayment(piJ.clientSecret, { payment_method:{ card, billing_details:{ name, email } } });
        if(error) throw new Error(error.message);
        if(paymentIntent.status==='succeeded'){
          ok.innerHTML='<b>✓ お支払い完了 — 会員番号をメールでご案内します (24時間以内)</b><div style="font-size:11px;margin-top:6px">決済ID: '+paymentIntent.id+'<br>会員証は2-3週間で郵送 (転送不要)</div>';
          ok.style.display='block';
          setTimeout(()=>location.href='/members/', 1200);
        }
      } else {
        // konbini/paypay → Stripe Checkout redirect
        const sR=await fetch(apiBase + '/api/payments/shop/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ orderNo: 'JOIN-'+Date.now(), method: pay })});
        // For join, we use same endpoint with special handling
        // fallback: create PaymentIntent with konbini
        const piR=await fetch(apiBase + '/api/payments/join/intent', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ email: j.email||email, method: pay })});
        const piJ=await piR.json(); ok.innerHTML='<b>お支払い番号を発行しました</b><div style="font-size:11px;margin-top:6px">決済ID: '+piJ.paymentId+'<br>コンビニ/PayPayでお支払いください。期限: '+(pay==='konbini'?'2週間/月末':'—')+'</div>'; ok.style.display='block';
      }
    }catch(e){
      msg.textContent='エラー: '+e.message; msg.style.display='block';
    } finally { document.getElementById('payBtn').disabled=false; document.getElementById('payBtn').textContent='お支払いへ — Pay 5,140円 →'; }
    return;
  }
  // No demo fallback — production requires API
  msg.textContent='サービスはデプロイ準備中です — しばらくお待ちください。 Production API not yet ready.';
  msg.style.display='block'; msg.style.borderColor='#ffd1d1'; msg.style.background='#fff0f0'; msg.style.color='#8a1a1a';
  return;
});
</script>
</body></html>
